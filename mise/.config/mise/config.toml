[settings.self_update]
auto = true

[tools]
lazygit = "latest"
neovim = "latest"
gh = "latest"
fd = "latest"
fzf = "latest"
starship = "latest"
rg = "latest"
herdr = "latest"
pi = "latest"

[bootstrap.macos.dock]
autohide = true
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 15

[bootstrap.macos.trackpad]
tap_to_click = true

# zsh plugins (no native backend, so pinned GitHub tarballs via http)
[tools."http:zsh-autosuggestions"]
version = "0.7.1"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v{{ version }}.tar.gz"

[tools."http:zsh-syntax-highlighting"]
version = "0.8.0"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ version }}.tar.gz"

[tools."http:zsh-completions"]
version = "0.36.0"
url = "https://github.com/zsh-users/zsh-completions/archive/refs/tags/{{ version }}.tar.gz"

